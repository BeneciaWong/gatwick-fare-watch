<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gatwick fare watch</title>
<style>
:root{color-scheme:light dark;--bg:#eef3f7;--ink:#14233a;--mute:#5b6b80;--card:#fff;--line:#d5dee8;--up:#b3261e;--down:#1e7b4b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a2a;--ink:#e8eef6;--mute:#9db0c6;--card:#17263b;--line:#2a3b53;--up:#ff8a80;--down:#6fd6a0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 28px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:20px;overflow-x:auto}
h2{font-size:1.15rem;margin:0}.when{color:var(--mute);font-size:.9rem;margin:2px 0 12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:.85rem;border-top:0}
.p{font-weight:700;font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}
.note{color:var(--mute);font-size:.9rem}
</style></head><body><main>
<h1>Gatwick fare watch</h1>
<p class="sub">Return flights from London Gatwick, 18 Dec 2026 to 11 Jan 2027. Checked automatically every few hours.</p>
<div id="out"><p class="note">Loading prices…</p></div>
<p class="note">These are snapshots. Always confirm the price on the booking site before you pay.</p>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4);return m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
fetch('/api/prices').then(r=>r.json()).then(d=>{
 document.getElementById('out').innerHTML=d.map(t=>{
  const rows=t.rows.slice().sort((a,b)=>(a.price_gbp??1e9)-(b.price_gbp??1e9)).map(r=>{
   if(r.price_gbp==null)return `<tr><td>${esc(r.dest)}</td><td colspan="4" class="note">No result yet</td></tr>`;
   const c=r.prev!=null?r.price_gbp-r.prev:0;
   const ch=c?`<span class="${c>0?'up':'down'}">${c>0?'up':'down'} £${Math.abs(c)}</span>`:'';
   const sx=r.cheapest_any_gbp!=null&&r.cheapest_any_gbp<r.price_gbp?`£${esc(r.cheapest_any_gbp)} with separate tickets (riskier)`:'';
   return `<tr><td>${esc(r.dest)}</td><td class="p">£${esc(r.price_gbp)}</td><td>${ch}</td><td>${esc(r.airline)}</td><td class="note">${sx}</td></tr>`}).join('');
  return `<section><h2>${esc(t.label)}</h2><p class="when">${t.checked?'Oldest result checked '+ago(t.checked):'No checks finished yet. The first one takes about 30 minutes after setup.'}</p><table><tr><th>Destination</th><th>Single-ticket price</th><th>Change</th><th>Airline</th><th>Cheaper option</th></tr>${rows}</table></section>`}).join('');
}).catch(()=>{document.getElementById('out').innerHTML='<p class="note">Could not load prices. Refresh the page to try again.</p>'});
</script></body></html>
